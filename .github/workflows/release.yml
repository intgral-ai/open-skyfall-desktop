# Build/check only. No publisher, signing credentials, draft switch, release
# branch trigger or nightly invocation. Publication needs separate review.
name: Package builds (nonpublishing)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: v
        name: Resolve checkout version (never a publication decision)
        run: |
          . packaging/env.sh
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo '::error::Cargo.toml needs a SemVer version'
            exit 1
          fi
          { echo "version=$VERSION"; echo "date=$(date -u +%Y-%m-%d)"; } >>"$GITHUB_OUTPUT"

  icons:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - *checkout
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-icons
          save-if: false
      - run: cargo build --release --locked -p solidcraft-cli
      - run: |
          . packaging/env.sh
          make_icons target/release/solidcraft-cli icons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icons-${{ github.sha }}
          path: icons
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # Preserve the existing glibc >= 2.35 packaging baseline.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      NFPM_VERSION: 2.47.0
      PACKAGE_ID: release-linux-${{ matrix.arch }}
      PACKAGE_TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - *checkout
      - run: scripts/ci/build-jobs.sh
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream zsync rpm
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.deb }}.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-linux-${{ matrix.arch }}
          save-if: false
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Check the packages (no desktop launch)
        run: |
          dpkg-deb --info dist/release/*.deb
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/solidcraft$|usr/bin/solidcraft-cli$|metainfo|applications|THIRD-PARTY-LICENSES.txt'
          dpkg-deb --contents dist/release/*.deb | grep -E 'usr/bin/solvecraft-cli$'
          dpkg-deb --field dist/release/*.deb Replaces Conflicts Provides | grep -F solvecraft
          rpm -qip dist/release/*.rpm
          rpm -qlp dist/release/*.rpm | grep -E '/usr/bin/solidcraft$|THIRD-PARTY-LICENSES.txt'
          tar -tzf dist/release/*.tar.gz | grep -E '/bin/solidcraft$|THIRD-PARTY-LICENSES.txt'
          ldd target/release/solidcraft
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
            "$appimage" --appimage-updateinformation | grep -F 'gh-releases-zsync|'
            test -s "$appimage.zsync"
          done
          ls dist/release/solvecraft-*-linux-*.AppImage.zsync
      # Shared *build metadata* only: this is neither #15 inventory nor installed
      # acceptance. Null contractDigest explicitly blocks the release gate.
      - &package-evidence
        name: Bind package bytes to this checkout and contract manifest
        shell: python {0}
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if sha != os.environ['GITHUB_SHA']:
              raise SystemExit('package sourceRevision mismatch')
          if subprocess.run(['git', 'diff', '--quiet', 'HEAD', '--']).returncode != 0:
              raise SystemExit('dirty tracked package source; rebuild from the immutable checkout')
          directory = Path('dist/release')
          files = sorted(p for p in directory.iterdir() if p.is_file() and p.name != 'build.json')
          if not files:
              raise SystemExit('no built package artifacts')
          def digest(path):
              result = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(block)
              return result.hexdigest()
          manifest = Path('schema/mastra-runtime/v1/manifest.json')
          data = dict(version=1, packageId=os.environ['PACKAGE_ID'], sourceRevision=sha,
                      target=os.environ['PACKAGE_TARGET'], contractDigest='sha256:' + digest(manifest) if manifest.is_file() else None,
                      artifacts=[dict(name=p.name, sha256=digest(p)) for p in files])
          (directory / 'build.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
      - &upload-package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_ID }}
          path: dist/release/*
          if-no-files-found: error
      - &upload-evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-evidence-${{ env.PACKAGE_ID }}
          path: dist/release/build.json
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PACKAGE_ID: release-flatpak-${{ matrix.arch }}
      PACKAGE_TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder and smoke tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common xvfb xauth weston dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and smoke-test the Flatpak in its network-denying sandbox
        # The existing manifest grants no network. Its desktop smoke stays inside
        # that sandbox; never add a host network override to make it pass.
        run: packaging/linux/flatpak-bundle.sh "dist/linux/solidcraft-$SOLIDCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz"
      - *package-evidence
      - *upload-package
      - *upload-evidence

  arch:
    name: Arch Linux ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_ID: release-arch-${{ matrix.arch }}
      PACKAGE_TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - id: pkgver
        name: Arch version
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          pkgver="${VERSION//-/}"
          echo "pkgver=$pkgver" >>"$GITHUB_OUTPUT"
          if [ "$pkgver" != "$VERSION" ]; then
            cp "dist/linux/solidcraft-$VERSION-linux-$ARCH.tar.gz" "dist/linux/solidcraft-$pkgver-linux-$ARCH.tar.gz"
          fi
      - uses: storytold/craft-common-actions/actions/arch-package@fa5ef18780cf5e7d5d3b8de068de56cffc83cac5 # main
        with:
          tarball: dist/linux/solidcraft-${{ steps.pkgver.outputs.pkgver }}-linux-${{ matrix.arch }}.tar.gz
          arch: ${{ matrix.arch }}
      - name: The package under the checkout version
        if: steps.pkgver.outputs.pkgver != env.VERSION
        env:
          ARCH: ${{ matrix.arch }}
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}
        run: sudo mv "dist/release/solidcraft-$PKGVER-linux-$ARCH.pkg.tar.zst" "dist/release/solidcraft-$VERSION-linux-$ARCH.pkg.tar.zst"
      - name: Check the package
        env:
          PKG: dist/release/solidcraft-${{ env.VERSION }}-linux-${{ matrix.arch }}.pkg.tar.zst
        run: |
          tar --zstd -tf "$PKG" | grep -E '^usr/bin/solidcraft$|^usr/bin/solidcraft-cli$|^usr/share/applications/io\.tangencylabs\.solidcraft\.desktop$'
          tar --zstd -xOf "$PKG" .PKGINFO | grep -E '^(pkgname|pkgver|arch) = '
          tar --zstd -xOf "$PKG" .PKGINFO | grep -qx 'pkgname = io.tangencylabs.solidcraft'
      - *package-evidence
      - *upload-package
      - *upload-evidence

  snap:
    name: Snap ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PACKAGE_ID: release-snap-${{ matrix.arch }}
      PACKAGE_TARGET: ${{ matrix.arch }}-unknown-linux-gnu
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Build the snap
        run: |
          sudo --preserve-env=SOLIDCRAFT_VERSION,SOLIDCRAFT_BUILD_DATE env "PATH=$PATH" \
            packaging/linux/snap-pack.sh --destructive-mode "dist/linux/solidcraft-$SOLIDCRAFT_VERSION-linux-${{ matrix.arch }}.tar.gz"
          sudo chown -R "$(id -u):$(id -g)" dist target
      - name: Install and check CLI only (desktop network isolation not implemented)
        run: |
          snap_file="dist/release/solidcraft-$SOLIDCRAFT_VERSION-linux-${{ matrix.arch }}.snap"
          sudo snap install --dangerous "$snap_file"
          snap info --verbose "$snap_file" | head -n 12
          snap connections solidcraft
          solidcraft.cli --version
          echo 'Snap desktop smoke BLOCKED: no supported updater-off switch; #14 installed runtime validation is still required.' >>"$GITHUB_STEP_SUMMARY"
      - *package-evidence
      - *upload-package
      - *upload-evidence

  freebsd:
    name: FreeBSD x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PACKAGE_ID: release-freebsd-x86_64
      PACKAGE_TARGET: x86_64-unknown-freebsd
    steps:
      - *checkout
      - name: Build and package in a FreeBSD VM (tar.gz)
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.3"
          usesh: true
          cpu: 4
          mem: 12288
          envs: "SOLIDCRAFT_VERSION SOLIDCRAFT_BUILD_DATE"
          prepare: |
            pkg install -y bash git curl pkgconf libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -e
            . "$HOME/.cargo/env"
            git config --global --add safe.directory "$PWD"
            export CARGO_TARGET_DIR=/var/tmp/solidcraft-target CARGO_BUILD_JOBS=4
            bash packaging/freebsd/package.sh
            tar -tzf dist/release/solidcraft-*-freebsd-x86_64.tar.gz \
              | grep -E '/bin/solidcraft$|/bin/solidcraft-cli$|/share/applications/io\.tangencylabs\.solidcraft\.desktop$|/share/doc/solidcraft/THIRD-PARTY-LICENSES\.txt$'
      - *package-evidence
      - *upload-package
      - *upload-evidence

  macos-build:
    name: macOS build ${{ matrix.arch }}
    needs: version
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, target: aarch64-apple-darwin }
          - { arch: x86_64, target: x86_64-apple-darwin }
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
    steps:
      - *checkout
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-macos-${{ matrix.arch }}
          save-if: false
      - name: Build
        run: packaging/macos/package.sh --build-only ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bin-${{ matrix.arch }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/solidcraft
            target/${{ matrix.target }}/release/solidcraft-cli
            target/${{ matrix.target }}/release/solvecraft-cli
          if-no-files-found: error

  macos:
    name: macOS universal (ad-hoc only)
    needs: [version, macos-build]
    runs-on: macos-15
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOLIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PACKAGE_ID: release-macos
      PACKAGE_TARGET: universal-apple-darwin
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin-aarch64-${{ github.sha }}
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-bin-x86_64-${{ github.sha }}
          path: target/x86_64-apple-darwin/release
      - name: Join, package and mount-check (no credential signing)
        run: |
          chmod +x target/*-apple-darwin/release/solidcraft target/*-apple-darwin/release/solidcraft-cli target/*-apple-darwin/release/solvecraft-cli
          packaging/macos/package.sh --arch universal --skip-build
      - *package-evidence
      - *upload-package
      - *upload-evidence

  windows:
    name: Windows ${{ matrix.arch }} (unsigned)
    needs: [version, icons]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: x86, target: i686-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_ID: release-windows-${{ matrix.arch }}
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: icons-${{ github.sha }}
          path: icons
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-${{ matrix.arch }}
          save-if: false
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Build and check package (msi, portable zip; CLI on runnable architectures)
        shell: pwsh
        env:
          SOLIDCRAFT_ICONS: ${{ github.workspace }}/icons
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }}
      - *package-evidence
      - *upload-package
      - *upload-evidence

  web:
    name: Web (wasm)
    needs: version
    runs-on: ubuntu-24.04
    env:
      SOLIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      TRUNK_VERSION: 0.21.14
      PACKAGE_ID: release-web
      PACKAGE_TARGET: wasm32-unknown-unknown
    steps:
      - *checkout
      - run: scripts/ci/build-jobs.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-web
          save-if: false
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
      - name: Build and zip
        run: packaging/web/package.sh
      - *package-evidence
      - *upload-package
      - *upload-evidence

  package-builds:
    name: All nonpublishing package builds
    needs: [version, icons, linux, flatpak, arch, snap, freebsd, macos-build, macos, windows, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and check (not runtime release acceptance)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS_JSON'])
          expected = {'version', 'icons', 'linux', 'flatpak', 'arch', 'snap', 'freebsd', 'macos-build', 'macos', 'windows', 'web'}
          bad = [job for job in sorted(expected) if needs.get(job, {}).get('result') != 'success']
          for job in bad:
              print('FAIL: ' + job + ': missing/failed/cancelled/skipped package build')
          sys.exit(1 if bad else 0)
          PY

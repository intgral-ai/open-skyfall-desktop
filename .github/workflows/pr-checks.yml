# Three quick checks on every pull request (CONTRIBUTING.md, "Sending a change"): no second open PR
# for an issue a lower-numbered one already closes, the "Changes a default:" line is filled in, and
# a PR adding to the showcase shows a picture. These are advisory checks, not branch admission.
# The pure branchPolicy export is for the required CI policy job, not a write-enabled bot job.
# The logic is in scripts/pr-checks/pr-checks.js (tested in ci.yml).
name: PR checks

on:
  # Never pull_request_target. Read-only checks run scripts from the PR merge commit.
  # The write-enabled label job uses only the trusted base commit, never PR code.
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  duplicate:
    name: Duplicate PR check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-checks
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checks = require('./scripts/pr-checks/pr-checks.js');
            const r = await checks.checkDuplicate({ github, context, core });
            core.info(JSON.stringify(r));

  defaults:
    name: Defaults line check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-checks
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checks = require('./scripts/pr-checks/pr-checks.js');
            const r = await checks.checkDefaults({ github, context, core });
            core.info(JSON.stringify(r));

  picture:
    name: Picture check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/pr-checks
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checks = require('./scripts/pr-checks/pr-checks.js');
            const r = await checks.checkPicture({ github, context, core });
            core.info(JSON.stringify(r));

  # Labelling needs write access, which a fork PR's token never has, so it is its own job and best
  # effort: a fork PR just doesn't get the `changes-default` label from here.
  label:
    name: Label changes-default
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/pr-checks
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checks = require('./scripts/pr-checks/pr-checks.js');
            await checks.syncDefaultLabel({ github, context, core });

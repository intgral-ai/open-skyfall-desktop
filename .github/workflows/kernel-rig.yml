# The kernel rig and the complexity ladder as a regression gate. A plan job maps a pull request's
# changed files to the rig areas they can affect (scripts/ci/kernel_rig_plan.py): an area runs
# when a file its tests/kernel-cases/<area>/PATHS lists changes, or one of its cases; every area
# runs when the shared core in tests/kernel-cases/PATHS-ALL changes, and when the solidcore pin in
# the root Cargo.toml and Cargo.lock moves (the plan reads their diff); the ladder runs whenever any
# area does. One job then builds solidcraft-cli once (release), checks that every
# registry command has a case or an exemption (tests/kernel-cases/EXEMPT), and hands the CLI to a
# matrix of shards as an artifact, one per selected area plus the ladder, in parallel, so the
# wall time is the build plus the slowest shard. See tests/kernel-cases/README.md.
#
# - An area fails on a regression (a case that fails and its tests/kernel-cases/<area>/KNOWN_FAILING
#   does not list) or on a listed case that passes (it is fixed: remove its line in the same pull
#   request, so the list only shrinks).
# - The ladder fails on any case whose status or counts differ from
#   tests/kernel-cases/ladder/golden.json; a right change is re-recorded (`--record "why"`).
#
# The trigger paths are whole folders that hold every area's PATHS (a self-test,
# scripts/ci/test_kernel_rig_plan.py, checks they do), so a pull request that touches none of
# them (the UI, docs, packaging) starts no runner at all, and a new area needs no edit here: the
# plan finds the areas from the folders. Pushes to main and develop on the same paths, merge groups
# (once the queue is on), the release gate (release-gate.yml, workflow_call) and a run by hand run
# every area. Reusable release validation explicitly forces full selection even
# when the inherited caller event is a draft PR. Raw results and the existing
# Rust graders are bound to this checkout; no carried result or success stub.
name: Kernel rig

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "crates/kernel/**"
      - "crates/geom/**"
      - "crates/smlib/**"
      - "crates/step/**"
      - "crates/io/src/**"
      - "crates/doc/src/**"
      - "crates/engine/src/**"
      - "tests/kernel-cases/**"
      # The solidcore pin (the plan runs every area only when its lines change).
      - "Cargo.toml"
      - "Cargo.lock"
      # The rig itself: the grading, the runner, the selection and this workflow.
      - "apps/solidcraft-cli/src/kernel_cases.rs"
      - "xtask/src/kernel_cases.rs"
      - "xtask/src/kernel_ladder.rs"
      - "scripts/ci/kernel_rig_plan.py"
      - "scripts/ci/gate.py"
      - "scripts/ci/test_kernel_rig_plan.py"
      - ".github/workflows/kernel-rig.yml"
  push:
    branches: [main, develop]
    # The same paths as pull_request.
    paths:
      - "crates/kernel/**"
      - "crates/geom/**"
      - "crates/smlib/**"
      - "crates/step/**"
      - "crates/io/src/**"
      - "crates/doc/src/**"
      - "crates/engine/src/**"
      - "tests/kernel-cases/**"
      # The solidcore pin (the plan runs every area only when its lines change).
      - "Cargo.toml"
      - "Cargo.lock"
      # The rig itself: the grading, the runner, the selection and this workflow.
      - "apps/solidcraft-cli/src/kernel_cases.rs"
      - "xtask/src/kernel_cases.rs"
      - "xtask/src/kernel_ladder.rs"
      - "scripts/ci/kernel_rig_plan.py"
      - "scripts/ci/gate.py"
      - "scripts/ci/test_kernel_rig_plan.py"
      - ".github/workflows/kernel-rig.yml"
  merge_group:
  workflow_call:
    inputs:
      concurrency_namespace:
        type: string
        default: reusable
      full_validation:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Dedup updates within each caller/ref, never cancel direct and reusable runs
  # of the same PR against one another.
  group: kernel-rig-${{ inputs.concurrency_namespace || 'direct' }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target/rig
  SOLIDCRAFT_GPU: software
  SOLIDCRAFT_REQUIRE_GPU: "1"
  WGPU_BACKEND: vulkan

jobs:
  plan:
    name: Select the rig areas
    if: inputs.full_validation || github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The shard matrix (JSON list of areas and the ladder; [] when nothing is selected).
      shards: ${{ steps.plan.outputs.shards }}
      # Whether the build job, and with it the coverage check, runs.
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Selection self-test
        run: python3 -I scripts/ci/test_kernel_rig_plan.py
      - id: plan
        name: Map the changed files to areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_VALIDATION: ${{ inputs.full_validation || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Release calls force all areas + ladder regardless of PR/draft.
          # Unavailable comparisons select full, never an empty successful diff.
          if [ "$FULL_VALIDATION" = true ] || [ "$EVENT_NAME" != pull_request ]; then
            set -- --all
          elif git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/rig-paths" &&
               git diff --no-renames "$BASE_SHA...$HEAD_SHA" -- Cargo.toml Cargo.lock > "$RUNNER_TEMP/rig-pin.diff"; then
            set -- --paths "$RUNNER_TEMP/rig-paths" --pin-diff "$RUNNER_TEMP/rig-pin.diff"
          else
            set -- --all
          fi
          python3 -I scripts/ci/kernel_rig_plan.py "$@" --root . --expected-revision "$GITHUB_SHA" \
            --out rig-plan/plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-rig-plan-${{ github.sha }}
          path: rig-plan/plan.json
          if-no-files-found: error

  build:
    name: Build the CLI
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-rig-plan-${{ github.sha }}
          path: rig-plan
      - name: Size parallel compiles to the job's memory
        run: scripts/ci/build-jobs.sh
      - name: Native build dependencies and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: kernel-rig
          workspaces: . -> target/rig
          cache-workspace-crates: false
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: Runner image and available resources (not a capacity certification)
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          free -h
          df -h .
      - name: Build the CLI and rig runner; check command coverage; bind actual binary bytes
        run: python3 -I scripts/ci/kernel_rig_plan.py build --plan rig-plan/plan.json --expected-revision "$GITHUB_SHA" --out rig-build
      # A tar keeps the executable bits, which an artifact drops. xtask finds the repository from
      # the path it was built in (CARGO_MANIFEST_DIR), which is the same checkout path in every
      # job of this workflow.
      # Coverage-only builds also carry their binaries to the aggregate so their
      # physical byte identities are checked, even when no shard was selected.
      - name: Pack the binaries
        run: tar -cf "$RUNNER_TEMP/kernel-rig-bin.tar" target/rig/release/solidcraft-cli target/rig/debug/xtask rig-build/build.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-rig-bin-${{ github.sha }}
          path: ${{ runner.temp }}/kernel-rig-bin.tar
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kernel-rig-build-${{ github.sha }}
          path: rig-build/build.json
          if-no-files-found: error

  shard:
    name: Kernel rig (${{ matrix.shard }})
    needs: [plan, build]
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Bounded existing area partitions. Actual hosted memory/time limits still
        # need measured Actions evidence; do not infer capacity from this label.
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-rig-plan-${{ github.sha }}
          path: rig-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel-rig-bin-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack the binaries
        run: tar -xf "$RUNNER_TEMP/kernel-rig-bin.tar"
      - name: Runtime libraries and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64 libudev1 libxkbcommon0 libvulkan1 mesa-vulkan-drivers
      - name: Run the cases against the known-failing list (the ladder against its golden)
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 -I scripts/ci/kernel_rig_plan.py shard --plan rig-plan/plan.json --expected-revision "$GITHUB_SHA" --shard "$SHARD" --out "rig-results/$SHARD"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-rig-results-${{ matrix.shard }}-${{ github.sha }}
          path: rig-results/
          if-no-files-found: error

  # One check for the whole gate, for branch protection and the merge queue.
  kernel-rig:
    name: kernel-rig
    needs: [plan, build, shard]
    if: always() && (inputs.full_validation || github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          name: kernel-rig-plan-${{ github.sha }}
          path: rig-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && needs.build.result == 'success'
        with:
          name: kernel-rig-bin-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack the same-run verified binary handoff
        if: always() && needs.build.result == 'success'
        run: tar -xf "$RUNNER_TEMP/kernel-rig-bin.tar"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]'
        with:
          pattern: kernel-rig-results-*-${{ github.sha }}
          path: rig-results
          merge-multiple: true
      # The adapter checks actual raw identities/outcomes and command exits, not
      # a producer-supplied pass flag. Only unselected jobs may be skipped.
      - name: Verify actual needs, same-source binaries, complete raw reports and graders
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FULL_VALIDATION: ${{ inputs.full_validation || false }}
        run: |
          printf '%s\n' "$NEEDS_JSON" >rig-needs.json
          set --
          if [ "$FULL_VALIDATION" = true ]; then set -- --require-full; fi
          python3 -I scripts/ci/kernel_rig_plan.py verify --plan rig-plan/plan.json --expected-revision "$GITHUB_SHA" \
            --needs rig-needs.json --evidence . --handoff rig-handoff "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-rig-handoff-${{ github.sha }}
          path: rig-handoff/
          if-no-files-found: error
